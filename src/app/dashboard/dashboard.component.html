<div class="dashboard">

  <div class="watermark">
    IDEAS LAB
  </div>

  <h1>📊 Panel Principal</h1>

  <div *ngIf="loading" style="text-align: center;">Cargando...</div>

  <div *ngIf="!loading">
    
    <div style="display: flex; gap: 20px; margin-bottom: 30px;">
      <div style="background: white; padding: 20px; border-radius: 12px; flex: 1;">
        <h3>Total Productos</h3>
        <p style="font-size: 32px; font-weight: bold;">{{ totalProductos }}</p>
      </div>

      <div style="background: white; padding: 20px; border-radius: 12px; flex: 1;">
        <h3>Stock Bajo</h3>
        <p style="font-size: 32px; font-weight: bold; color: #f59e0b;">
          {{ stockBajo }}
        </p>
      </div>
    </div>

    <div style="background: white; border-radius: 12px; padding: 20px;">
      <h2>Últimos Movimientos</h2>

      <div *ngFor="let m of ultimosMovimientos"
           style="border-bottom: 1px solid #eee; padding: 10px;">
        <strong>Producto:</strong> {{ m.nombreProducto }} |
        <strong>Tipo:</strong>
        {{ m.tipo === 'entrada' ? '➕ Entrada' : '➖ Salida' }} |
        <strong>Cantidad:</strong> {{ m.cantidad }}
      </div>

      <div *ngIf="ultimosMovimientos.length === 0"
           style="text-align: center;">
        No hay movimientos
      </div>
    </div>

  </div>

</div>
