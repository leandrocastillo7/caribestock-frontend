<div class="login-container">
  <div class="login-card">
    <h1>🏝️ CaribeStock</h1>
    <p>Sistema de Gestión de Inventarios</p>
    
    <div class="form-group">
      <input 
        type="text" 
        [(ngModel)]="username" 
        name="username"
        placeholder="Usuario" 
        required>
    </div>
    
    <div class="form-group">
      <input 
        type="password" 
        [(ngModel)]="password" 
        name="password"
        placeholder="Contraseña" 
        required>
    </div>
    
    <div class="error" *ngIf="error">{{ error }}</div>
    
    <button (click)="onSubmit()" [disabled]="loading">
      {{ loading ? 'Ingresando...' : 'Iniciar Sesión' }}
    </button>
  </div>
</div>
